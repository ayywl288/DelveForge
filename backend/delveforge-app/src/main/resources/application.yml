server:
  address: 127.0.0.1

spring:
  application:
    name: delveforge

delveforge:
  workbench:
    model:
      context-window-tokens: ${delveforge.agent.context-window-tokens:1000000}
      response-tokens: ${delveforge.agent.response-tokens:65536}
      compaction-threshold: ${delveforge.agent.compaction-threshold:0.90}
      timeout: ${delveforge.ai.deepseek.timeout:90s}
      max-request-bytes: ${delveforge.ai.deepseek.max-request-bytes:8388608}
      max-response-bytes: ${delveforge.ai.deepseek.max-response-bytes:33554432}

logging:
  file:
    name: ${DELVEFORGE_LOG_DIR:./logs}/delveforge.log
  level:
    root: INFO
    # 保留脱敏后的控制端诊断，防止 SDK 输出协议正文、私有推理或凭据。
    org.springframework.ai.deepseek: "OFF"
    org.springframework.ai.openai: "OFF"
    org.springframework.ai.anthropic: "OFF"
    org.springframework.ai.google.genai: "OFF"
    com.openai: "OFF"
    com.anthropic: "OFF"
    com.google.genai: "OFF"
    okhttp3: WARN
    org.springframework.web: INFO
    org.apache.tomcat: INFO
    org.apache.coyote: INFO
