user nginx;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    resolver 127.0.0.1 valid=60s ipv6=off;
    resolver_timeout 10s;
    proxy_cache_path /cache/central levels=1:2 keys_zone=central:8m max_size=2g inactive=30d use_temp_path=off;
    map $uri $bypass {
        default 1;
        ~*snapshot 1;
        ~*maven-metadata 1;
        ~^/maven2/.+/[^/]+/[^/]+\.(jar|pom|war|aar|zip|module)(\.(sha1|sha256|sha512|md5|asc))?$ 0;
    }
    map $upstream_status $skip_response { default 1; 200 0; }
    log_format transfers '$request_method $uri $status $upstream_cache_status upstream=$upstream_bytes_received';
    access_log /dev/stdout transfers;
    server {
        listen 8082;
        server_name _;
        client_max_body_size 1k;
        location = /health { access_log off; return 204; }
        location /maven2/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            if ($http_authorization != "") { return 403; }
            if ($http_cookie != "") { return 403; }
            if ($args != "") { return 400; }
            if ($request_uri !~ ^/maven2/[A-Za-z0-9_./+~:-]+$) { return 400; }
            if ($request_uri ~ "/\.\.?/") { return 400; }
            set $central repo.maven.apache.org;
            proxy_pass https://$central$uri;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host repo.maven.apache.org;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name repo.maven.apache.org;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 6;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            # 此固定公共来源不接收客户端身份头。CDN 的访客 cookie 不进入缓存或下游响应。
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_cache central;
            proxy_cache_key https://repo.maven.apache.org$uri;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_lock_age 90s;
            proxy_cache_valid 200 24h;
            proxy_cache_bypass $bypass;
            proxy_no_cache $bypass $skip_response;
            add_header X-DelveForge-Cache $upstream_cache_status always;
        }
        location / { return 404; }
    }
}
